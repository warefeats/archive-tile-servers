services:
  engine:
    image: ats-bbox:0.6.2
    build:
      context: ..
      dockerfile: Dockerfile.bbox
    command: ["bbox-tile-server", "-c", "/config/bbox.toml", "serve"]
    volumes:
      - ../configs/bbox-mbtiles:/config:ro
      - ../data/cache/archives:/tiles:ro
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8099}:8080"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
